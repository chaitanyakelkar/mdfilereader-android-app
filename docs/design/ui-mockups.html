<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MD Reader UI mockups</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; background: #E9E9E4; color: #1C1C1A;
         font: 14px/1.5 Roboto, "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: #5C5C57; margin: 0 0 28px; }
  .grid { display: flex; flex-wrap: wrap; gap: 32px; }
  figure { margin: 0; width: 300px; }
  figcaption { font-weight: 600; margin-bottom: 2px; }
  .note { color: #5C5C57; font-size: 12px; min-height: 36px; margin-bottom: 8px; }

  .phone { --bg:#FBFBF9; --fg:#1C1C1A; --muted:#5C5C57; --accent:#2A5B8C; --code:#F0F0EC; --line:#DDDDD8; --sheet:#F4F4F0;
           --hl:#FFE27A; --hl2:#FFB74D; --kw:#8A2C8F; --str:#2C6E3F;
           position: relative; width: 300px; height: 620px; background: var(--bg); color: var(--fg);
           border: 6px solid #222; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; }
  .phone.dark { --bg:#141517; --fg:#E6E5E1; --muted:#A5A6A2; --accent:#9CC3EA; --code:#212327; --line:#34363B; --sheet:#1E2023; --kw:#D7A6DB; --str:#9AD0A8; }
  .phone.sepia { --bg:#F5ECD9; --fg:#3B2F20; --muted:#6A5A44; --accent:#7A4B1E; --code:#EBDFC6; --line:#D8CAAC; --sheet:#EFE4CC; --kw:#7A2F6B; --str:#3F6A2E; }

  .status { height: 22px; font-size: 11px; display: flex; justify-content: space-between; padding: 4px 14px 0; color: var(--muted); flex: none; }
  .bar { display: flex; align-items: center; height: 52px; padding: 0 4px; flex: none; }
  .bar .title { flex: 1; font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  .ic { width: 40px; height: 40px; display: grid; place-items: center; font-size: 18px; color: var(--fg); flex: none; }
  .big { font-size: 26px; padding: 4px 18px 12px; flex: none; }
  .progress { height: 2px; background: var(--line); flex: none; }
  .progress i { display: block; height: 2px; background: var(--accent); }
  .body { flex: 1; overflow: hidden; padding: 6px 16px; font-size: 13px; line-height: 1.6; }
  .body h2 { font-size: 19px; line-height: 1.3; margin: 8px 0 4px; padding-bottom: 5px; border-bottom: 1px solid var(--line); }
  .body h3 { font-size: 15px; margin: 12px 0 4px; }
  .body p { margin: 0 0 9px; }
  a { color: var(--accent); }
  code { font: 11.5px Consolas, monospace; background: var(--code); padding: 1px 3px; border-radius: 3px; }
  .code { background: var(--code); border-radius: 7px; margin-bottom: 10px; overflow: hidden; }
  .code .head { display: flex; justify-content: space-between; padding: 4px 9px; font-size: 11px; color: var(--muted); }
  .code pre { margin: 0; padding: 0 9px 9px; font: 11px/1.55 Consolas, monospace; white-space: pre; overflow: hidden; }
  .kw { color: var(--kw); } .str { color: var(--str); }
  table { border-collapse: collapse; font-size: 11.5px; white-space: nowrap; }
  th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  th { background: var(--code); }
  .tablewrap { overflow: hidden; margin-bottom: 4px; }
  .hint { font-size: 10px; color: var(--muted); margin-bottom: 9px; }
  blockquote { margin: 0 0 9px; padding-left: 9px; border-left: 3px solid var(--accent); color: var(--muted); }
  .task { display: flex; gap: 6px; align-items: baseline; }
  mark { background: var(--hl); color: inherit; } mark.cur { background: var(--hl2); }

  .row { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 18px; }
  .row .doc { width: 34px; height: 34px; border-radius: 8px; background: var(--code); display: grid; place-items: center; color: var(--accent); }
  .row .t { flex: 1; min-width: 0; }
  .row .t b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { font-size: 11px; color: var(--muted); }
  .fab { position: absolute; right: 14px; bottom: 18px; background: var(--accent); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-weight: 500; box-shadow: 0 2px 6px #0004; }
  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 10px; }
  .empty .glyph { font-size: 40px; color: var(--accent); }
  .btn { background: var(--accent); color: var(--bg); padding: 9px 18px; border-radius: 20px; font-weight: 500; }
  .btn.text { background: none; color: var(--accent); }

  .scrim { position: absolute; inset: 0; background: #0005; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--sheet); border-radius: 18px 18px 0 0; padding: 8px 18px 20px; }
  .handle { width: 32px; height: 4px; border-radius: 2px; background: var(--muted); margin: 2px auto 12px; opacity: .6; }
  .sheet h4 { margin: 0 0 8px; font-size: 15px; font-weight: 500; }
  .toc div { padding: 7px 0; } .toc .l2 { padding-left: 14px; } .toc .l3 { padding-left: 28px; color: var(--muted); }
  .label { font-size: 11px; color: var(--muted); margin: 12px 0 5px; }
  .seg { display: flex; border: 1px solid var(--muted); border-radius: 18px; overflow: hidden; font-size: 12px; }
  .seg span { flex: 1; text-align: center; padding: 7px 0; border-left: 1px solid var(--muted); }
  .seg span:first-child { border-left: 0; }
  .seg .on { background: var(--accent); color: var(--bg); }
  .size { display: flex; align-items: center; justify-content: space-between; }
  .sw { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .switch { width: 36px; height: 20px; background: var(--accent); border-radius: 10px; position: relative; }
  .switch::after { content: ""; position: absolute; right: 2px; top: 2px; width: 16px; height: 16px; background: var(--bg); border-radius: 50%; }
  .field { flex: 1; font-size: 14px; border-bottom: 2px solid var(--accent); padding: 4px 2px; margin: 0 4px; }
  .count { font-size: 11px; color: var(--muted); padding: 0 4px; }
</style>
</head>
<body>
<h1>MD Reader: UI mockups</h1>
<p class="sub">Material 3, content first. Tokens and rationale are in docs/02-ui-design.md.</p>
<div class="grid">

<figure>
  <figcaption>1. Home, first run</figcaption>
  <div class="note">One clear action, plus a sample so the app can be tried with no file.</div>
  <div class="phone">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="bar"><span class="title"></span><span class="ic">Aa</span></div>
    <div class="big">MD Reader</div>
    <div class="empty">
      <div class="glyph">▤</div>
      <b>No recent files</b>
      <span style="color:var(--muted)">Open a Markdown file to start reading.</span>
      <span class="btn">Open file</span>
      <span class="btn text">Try the sample</span>
    </div>
  </div>
</figure>

<figure>
  <figcaption>2. Home, recents</figcaption>
  <div class="note">FAB stays in the thumb zone. Remove is per item.</div>
  <div class="phone">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="bar"><span class="title"></span><span class="ic">Aa</span></div>
    <div class="big">MD Reader</div>
    <div class="row"><span class="doc">▤</span><span class="t"><b>README.md</b><span>2 hours ago</span></span><span class="ic">✕</span></div>
    <div class="row"><span class="doc">▤</span><span class="t"><b>architecture-decisions.md</b><span>Yesterday</span></span><span class="ic">✕</span></div>
    <div class="row"><span class="doc">▤</span><span class="t"><b>CHANGELOG.markdown</b><span>3 days ago</span></span><span class="ic">✕</span></div>
    <div class="row"><span class="doc">▤</span><span class="t"><b>meeting-notes.md</b><span>Oct 28</span></span><span class="ic">✕</span></div>
    <div class="fab">＋ Open file</div>
  </div>
</figure>

<figure>
  <figcaption>3. Reader, light</figcaption>
  <div class="note">Table and code scroll sideways instead of reflowing.</div>
  <div class="phone">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="bar"><span class="ic">←</span><span class="title">README.md</span><span class="ic">⌕</span><span class="ic">≣</span><span class="ic">⋮</span></div>
    <div class="progress"><i style="width:35%"></i></div>
    <div class="body">
      <h2>Getting started</h2>
      <p>Install the <code>cli</code> tool, then read the <a href="#">configuration guide</a>.</p>
      <div class="code"><div class="head"><span>kotlin</span><span>⧉</span></div>
<pre><span class="kw">val</span> parser = Parser.builder().build()
<span class="kw">val</span> doc = parser.parse(<span class="str">"# Hello"</span>)</pre></div>
      <h3>Options</h3>
      <div class="tablewrap"><table>
        <tr><th>Name</th><th>Default</th><th>Description of the option</th></tr>
        <tr><td>theme</td><td>system</td><td>Which reader theme to apply at</td></tr>
        <tr><td>size</td><td>100%</td><td>Text size relative to the system</td></tr>
      </table></div>
      <div class="hint">swipe sideways for more →</div>
      <div class="task"><span>☑</span><span>Parser</span></div>
      <div class="task"><span>☐</span><span>Plugins</span></div>
    </div>
  </div>
</figure>

<figure>
  <figcaption>4. Reader, dark</figcaption>
  <div class="note">Near-black background with softened text for night reading.</div>
  <div class="phone dark">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="bar"><span class="ic">←</span><span class="title">README.md</span><span class="ic">⌕</span><span class="ic">≣</span><span class="ic">⋮</span></div>
    <div class="progress"><i style="width:35%"></i></div>
    <div class="body">
      <h2>Getting started</h2>
      <p>Install the <code>cli</code> tool, then read the <a href="#">configuration guide</a>.</p>
      <blockquote>Quotes get an accent bar and muted text.</blockquote>
      <div class="code"><div class="head"><span>kotlin</span><span>⧉</span></div>
<pre><span class="kw">val</span> parser = Parser.builder().build()
<span class="kw">val</span> doc = parser.parse(<span class="str">"# Hello"</span>)</pre></div>
      <div class="tablewrap"><table>
        <tr><th>Name</th><th>Default</th><th>Description</th></tr>
        <tr><td>theme</td><td>system</td><td>Reader theme</td></tr>
      </table></div>
    </div>
  </div>
</figure>

<figure>
  <figcaption>5. Find in document</figcaption>
  <div class="note">Top bar becomes the find bar. Back closes it first.</div>
  <div class="phone sepia">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="bar"><span class="ic">←</span><span class="field">parser</span><span class="count">3/12</span><span class="ic">⌃</span><span class="ic">⌄</span></div>
    <div class="progress"><i style="width:35%"></i></div>
    <div class="body">
      <p>The <mark>parser</mark> reads the document into a tree of blocks.</p>
      <p>Each <mark class="cur">parser</mark> extension adds a node type, and the <mark class="cur">parser</mark> then visits those nodes.</p>
      <p>Rendering runs after the <mark>parser</mark> finishes, off the main thread.</p>
      <h3>Notes</h3>
      <blockquote>Sepia is a reader theme, also applied to the app chrome.</blockquote>
    </div>
  </div>
</figure>

<figure>
  <figcaption>6. Contents sheet</figcaption>
  <div class="note">Tap a heading to jump. Indent shows the level.</div>
  <div class="phone">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="bar"><span class="ic">←</span><span class="title">README.md</span><span class="ic">⌕</span><span class="ic">≣</span><span class="ic">⋮</span></div>
    <div class="body"><h2>Getting started</h2><p>Install the tool, then read the guide.</p></div>
    <div class="scrim"></div>
    <div class="sheet toc"><div class="handle"></div><h4>Contents</h4>
      <div>Overview</div><div class="l2">Features</div><div>Getting started</div><div class="l2">Install</div><div class="l2">Options</div><div class="l3">Themes</div><div class="l3">Text size</div><div>License</div>
    </div>
  </div>
</figure>

<figure>
  <figcaption>7. Appearance sheet</figcaption>
  <div class="note">Changes apply live behind the sheet.</div>
  <div class="phone dark">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="bar"><span class="ic">←</span><span class="title">README.md</span><span class="ic">⌕</span><span class="ic">≣</span><span class="ic">⋮</span></div>
    <div class="body"><h2>Getting started</h2><p>Install the tool, then read the guide.</p></div>
    <div class="scrim"></div>
    <div class="sheet"><div class="handle"></div><h4>Appearance</h4>
      <div class="label">Theme</div>
      <div class="seg"><span>System</span><span>Light</span><span class="on">Dark</span><span>Sepia</span></div>
      <div class="label">Font</div>
      <div class="seg"><span class="on">Sans</span><span>Serif</span></div>
      <div class="label">Text size</div>
      <div class="size"><span class="ic">−</span><b>110%</b><span class="ic">＋</span></div>
      <div class="sw"><span>Load remote images</span><span class="switch"></span></div>
    </div>
  </div>
</figure>

<figure>
  <figcaption>8. Error state</figcaption>
  <div class="note">Says what happened and offers one way forward.</div>
  <div class="phone">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="bar"><span class="ic">←</span><span class="title">photo.jpg</span></div>
    <div class="empty">
      <div class="glyph">⚠</div>
      <b>This isn't a text file</b>
      <span style="color:var(--muted)">It looks like a binary file, so it can't be shown as Markdown.</span>
      <span class="btn">Choose another file</span>
    </div>
  </div>
</figure>

</div>
</body>
</html>
